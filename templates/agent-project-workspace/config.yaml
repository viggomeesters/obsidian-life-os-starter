project: "{{PROJECT_ID}}"

paths:
  dev_folder: "{{DEV_FOLDER}}"
  vault_project_note: "{{VAULT_PROJECT_NOTE}}"
  vault_entity_note: "{{VAULT_ENTITY_NOTE}}"
  schema: "{{DEV_FOLDER}}/schema.yaml"
  agents: "{{DEV_FOLDER}}/AGENTS.md"
  readme: "{{DEV_FOLDER}}/README.md"
  context: "{{DEV_FOLDER}}/context.md"
  tasks: "{{DEV_FOLDER}}/tasks.md"
  changelog: "{{DEV_FOLDER}}/changelog.md"
  glossary: "{{GLOSSARY_PATH}}"
  finish_task: "{{DEV_FOLDER}}/scripts/finish_task.py"
  next_task: "{{DEV_FOLDER}}/scripts/next_task.py"
  hermes_project: "{{DEV_FOLDER}}/.hermes/project.md"
  hermes_task_schema: "{{DEV_FOLDER}}/.hermes/task-schema.yaml"
  hermes_tasks: "{{DEV_FOLDER}}/.hermes/tasks.yaml"
  git_hooks: "{{DEV_FOLDER}}/.githooks"
  sources: "{{DEV_FOLDER}}/sources"
  work: "{{DEV_FOLDER}}/work"
  output: "{{DEV_FOLDER}}/output"

tools:
  template: "{{VAULT_PATH}}/system/templates/agent-project-workspace"
  initializer: "{{VAULT_PATH}}/system/scripts/agent_project_workspace/init_agent_project_workspace.py"
  validator: "{{VAULT_PATH}}/system/scripts/agent_project_workspace/validate_agent_project_workspace.py"
  command_doc: "{{VAULT_PATH}}/system/commands/agent-project-workspace.md"
  reference_doc: "{{VAULT_PATH}}/system/docs/agent-project-workspace-template.md"
